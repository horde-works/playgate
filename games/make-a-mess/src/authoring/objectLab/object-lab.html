<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Object Lab</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #d9dde0; }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      .plate { position: fixed; inset: 0; pointer-events: none; color: #25282b; }
      .title { position: absolute; top: 34px; left: 40px; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; font-weight: 750; }
      .subtitle { position: absolute; top: 58px; left: 40px; color: #61666a; font-size: 12px; letter-spacing: .04em; }
      .view { position: absolute; top: 34px; right: 40px; font-size: 14px; font-weight: 700; }
      .dimensions { position: absolute; right: 40px; bottom: 40px; text-align: right; font-size: 12px; line-height: 1.65; color: #4e5357; }
      .hash { position: absolute; left: 40px; bottom: 40px; color: #63686c; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
      .front { position: absolute; left: 50%; bottom: 38px; transform: translateX(-50%); color: #6b7074; font-size: 11px; letter-spacing: .12em; }
    </style>
  </head>
  <body>
    <div class="plate">
      <div class="title" id="title"></div>
      <div class="subtitle">STRUCTURAL GREY MODEL · METRES · Y UP</div>
      <div class="view" id="view"></div>
      <div class="dimensions" id="dimensions"></div>
      <div class="hash" id="hash"></div>
      <div class="front">FRONT +Z</div>
    </div>
    <script type="module" src="/object-lab.js"></script>
  </body>
</html>
