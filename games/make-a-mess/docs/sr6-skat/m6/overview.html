<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1280px; overflow: hidden; background: #e3e6e7; }
      body { padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 14px; }
      figure { margin: 0; min-width: 0; min-height: 0; background: #d9dde0; overflow: hidden; border: 1px solid #c5cace; }
      img { width: 100%; height: 100%; object-fit: contain; display: block; }
    </style>
  </head>
  <body>
    <figure><img src="right.png" /></figure>
    <figure><img src="top.png" /></figure>
    <figure><img src="three-quarter-right.png" /></figure>
    <figure><img src="underside.png" /></figure>
    <figure><img src="structural-cutaway.png" /></figure>
    <figure><img src="rotor-joint.png" /></figure>
  </body>
</html>
