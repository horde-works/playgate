<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .bg { fill: #10161a; }
      .panel { fill: #151e23; stroke: #304047; stroke-width: 2; }
      .title { fill: #edf2ef; font: 700 35px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .5px; }
      .subtitle { fill: #8ba0a7; font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #dbe4e1; font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #94a6ac; font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .note { fill: #b7c4c5; font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .dim { fill: #73d2de; font: 650 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .observed { fill: rgba(115,210,222,.09); stroke: #73d2de; stroke-width: 4; }
      .inferred { fill: rgba(242,183,93,.09); stroke: #f2b75d; stroke-width: 3; stroke-dasharray: 11 8; }
      .glass { fill: rgba(115,210,222,.18); stroke: #73d2de; stroke-width: 2; }
      .solid { fill: #9eaaa8; stroke: #e3e9e5; stroke-width: 2; }
      .roof { fill: #66767a; stroke: #dbe4e1; stroke-width: 2; }
      .construction { fill: none; stroke: #34434a; stroke-width: 1.5; stroke-dasharray: 5 7; }
      .dimension { fill: none; stroke: #73d2de; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .leader { fill: none; stroke: #f2b75d; stroke-width: 1.5; }
      .decision { fill: #1e292e; stroke: #f2b75d; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#73d2de"/>
    </marker>
    <pattern id="mullions" width="18" height="80" patternUnits="userSpaceOnUse">
      <rect width="18" height="80" fill="#24383e"/>
      <path d="M17 0V80" stroke="#73d2de" stroke-width="2"/>
    </pattern>
  </defs>

  <rect class="bg" width="1600" height="1050"/>
  <text class="title" x="60" y="62">ДВОРЕЦ ЦЕЛИННИКОВ · КОНТУР C01</text>
  <text class="subtitle" x="60" y="93">Историческое состояние 1963–1980-х · масштаб мира 1:1,6 · до фасадной детализации</text>
  <g transform="translate(1160 49)">
    <line x1="0" y1="0" x2="38" y2="0" class="observed"/>
    <text x="51" y="6" class="small">наблюдается</text>
    <line x1="190" y1="0" x2="228" y2="0" class="inferred"/>
    <text x="241" y="6" class="small">выведено</text>
  </g>

  <rect class="panel" x="60" y="130" width="720" height="665" rx="12"/>
  <text class="label" x="88" y="170">ПЛАН · предложенная схема</text>
  <text class="small" x="88" y="198">Фасад площади внизу; высокий зал смещён назад и влево</text>

  <!-- Top view, 11 px/m -->
  <g transform="translate(154 270)">
    <rect x="0" y="0" width="528" height="374" class="inferred"/>
    <rect x="22" y="11" width="374" height="264" class="solid"/>
    <path d="M0 275 H528 V374 H0 Z M396 11 H528 V275 H396 Z" class="glass" fill-rule="evenodd"/>
    <path d="M22 11 H396 V275 H22 Z" class="observed" fill="none"/>
    <line x1="0" y1="374" x2="528" y2="374" stroke="#73d2de" stroke-width="7"/>
    <line x1="528" y1="0" x2="528" y2="374" stroke="#73d2de" stroke-width="7"/>
    <text class="label" x="145" y="145">ВЫСОКИЙ ЗАЛ</text>
    <text class="small" x="155" y="173">34 × 24 м</text>
    <text class="small" x="171" y="330">стеклянное фойе · 9 м</text>
    <text class="small" transform="translate(466 182) rotate(90)" text-anchor="middle">правое крыло · 12 м</text>
    <text class="small" x="158" y="409">ГЛАВНЫЙ ФАСАД / ПЛОЩАДЬ</text>
    <path class="construction" d="M264 -55 V430 M-45 187 H573"/>
    <path class="dimension" d="M0 450 H528"/>
    <text class="dim" x="264" y="475" text-anchor="middle">48 м</text>
    <path class="dimension" d="M-58 0 V374"/>
    <text class="dim" x="-80" y="187" transform="rotate(-90 -80 187)" text-anchor="middle">34 м</text>
    <path class="leader" d="M498 16 L566 -33 H620"/>
    <text class="small" x="570" y="-42">задняя полоса 1 м</text>
    <text class="small" x="570" y="-22">наиболее условна</text>
  </g>

  <rect class="panel" x="820" y="130" width="720" height="318" rx="12"/>
  <text class="label" x="848" y="170">ФАСАД ПЛОЩАДИ</text>
  <text class="small" x="848" y="198">Объём и кровля наблюдаются на R1, R2, R4, R5</text>
  <g transform="translate(905 240)">
    <!-- 11 px/m wide, 10 px/m high -->
    <rect x="0" y="102" width="528" height="52" fill="url(#mullions)" stroke="#73d2de" stroke-width="2"/>
    <rect x="0" y="132" width="528" height="22" fill="#182227" stroke="#73d2de" stroke-width="2"/>
    <rect x="22" y="17" width="374" height="85" class="solid"/>
    <path d="M22 17 L55 0 H363 L396 17 Z" class="roof"/>
    <path d="M45 72 H373" stroke="#52646a" stroke-width="8" stroke-dasharray="18 10"/>
    <path class="dimension" d="M-35 154 V0"/>
    <text class="dim" transform="translate(-53 77) rotate(-90)" text-anchor="middle">15,625 м</text>
    <path class="dimension" d="M0 185 H528"/>
    <text class="dim" x="264" y="208" text-anchor="middle">48 м</text>
    <text class="small" x="218" y="52" text-anchor="middle">светлый модульный фасад</text>
  </g>

  <rect class="panel" x="820" y="477" width="720" height="318" rx="12"/>
  <text class="label" x="848" y="517">ПРАВЫЙ ПРОФИЛЬ</text>
  <text class="small" x="848" y="545">Стеклянный возврат наблюдается на R3; задняя грань не зафиксирована</text>
  <g transform="translate(910 587)">
    <!-- 14 px/m deep, 10 px/m high -->
    <rect x="0" y="102" width="476" height="52" fill="url(#mullions)" stroke="#73d2de" stroke-width="2"/>
    <rect x="126" y="17" width="336" height="85" class="solid"/>
    <path d="M126 17 L154 0 H434 L462 17 Z" class="roof"/>
    <path class="inferred" d="M462 17 H476 V154 H462" fill="none"/>
    <path class="dimension" d="M0 185 H476"/>
    <text class="dim" x="238" y="208" text-anchor="middle">34 м</text>
    <path class="dimension" d="M0 174 H126"/>
    <text class="dim" x="63" y="165" text-anchor="middle">фойе 9 м</text>
    <text class="small" x="276" y="53" text-anchor="middle">зал 24 м</text>
  </g>

  <rect class="decision" x="60" y="830" width="1480" height="160" rx="12"/>
  <text class="label" x="90" y="872">ТОЧКА РЕШЕНИЯ</text>
  <text class="note" x="90" y="907">Предлагаю принять асимметричную схему: прямоугольное стеклянное основание 48 × 34 м,</text>
  <text class="note" x="90" y="937">зал 34 × 24 м у задней левой кромки. Это сводит воедино фасад площади и длинный стеклянный угол.</text>
  <text class="note" x="90" y="967">После принятия — только изолированный серый блок-аут; вывески, окна и материалы ещё не строятся.</text>
  <g transform="translate(1295 870)">
    <rect x="0" y="0" width="190" height="72" rx="8" fill="#f2b75d"/>
    <text x="95" y="30" text-anchor="middle" style="fill:#10161a;font:800 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">НУЖНО ПРИНЯТЬ</text>
    <text x="95" y="53" text-anchor="middle" style="fill:#10161a;font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">КОНТУР C01</text>
  </g>
</svg>
